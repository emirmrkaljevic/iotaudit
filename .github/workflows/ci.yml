name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,mcp]"
      - run: ruff check src tests
      - run: pytest -q
      - name: Build wheel and verify install
        run: |
          pip install build
          python -m build
          python -m venv /tmp/iotaudit-ci
          /tmp/iotaudit-ci/bin/pip install dist/*.whl
          /tmp/iotaudit-ci/bin/python -c "
from importlib.resources import files
from iotaudit.enrich import mac_vendor
assert files('iotaudit').joinpath('data/oui.txt.gz').is_file()
assert mac_vendor('70:87:9e:00:00:01')
assert mac_vendor('00:03:93:00:00:01') == 'Apple'
print('wheel install + OUI OK')
"
