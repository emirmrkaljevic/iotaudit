id: iotbing-cloud
name: iotbing.com cloud device (Tuya-associated pet feeder / camera)
match:
  mac_vendors: ["Bilian", "Tuya", "Espressif"]
  domains: ["iotbing.com"]
expected_domains: ["iotbing.com", "ntp.org"]
expected_ports: [443, 8883, 3478, 123]
notes: >
  Observed facts: devices query a1-us/a1-eu/a1-sg.iotbing.com (and related hostnames).
  Third-party hostname classification (e.g. Netify) associates *.iotbing.com with the Tuya
  Smart IoT platform; TLS certificates cover *.iotbing.com. Typical traffic: HTTPS + MQTT-over-TLS
  to AWS, STUN/TURN (3478) for P2P video, sometimes a custom TCP port (e.g. 1443). Confirm per
  capture; do not treat association as a legal claim about any brand.
