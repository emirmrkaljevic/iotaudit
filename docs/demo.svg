<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="780" height="420" viewBox="0 0 780 420" role="img" aria-label="iotaudit terminal demo">
<title>iotaudit demo: capture, UPnP, default-password check</title>
<rect width="100%" height="100%" rx="10" ry="10" fill="#1a1b26"/>
<circle cx="22" cy="16" r="6" fill="#ff757f"/><circle cx="42" cy="16" r="6" fill="#ffc777"/><circle cx="62" cy="16" r="6" fill="#7fd962"/>
<text x="80" y="20" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" fill="#7a88b8">iotaudit — own devices only</text>
<text x="18" y="44" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#4fd6be" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.000;0.023;1" dur="15.0s" repeatCount="indefinite"/>$ sudo iotaudit capture --mode arp --i-own-this-network</text>
<text x="18" y="62" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7a88b8" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.080;0.103;1" dur="15.0s" repeatCount="indefinite"/>Consent given via --i-own-this-network.</text>
<text x="18" y="80" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7a88b8" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.107;0.130;1" dur="15.0s" repeatCount="indefinite"/>Scanning the LAN for devices...</text>
<text x="18" y="98" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#c8d3f5" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.173;0.197;1" dur="15.0s" repeatCount="indefinite"/>  [1] 192.168.0.50  Tuya-assoc. pet feeder</text>
<text x="18" y="116" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#c8d3f5" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.173;0.197;1" dur="15.0s" repeatCount="indefinite"/>  [2] 192.168.0.12  Amazon Echo</text>
<text x="18" y="134" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7a88b8" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.173;0.197;1" dur="15.0s" repeatCount="indefinite"/>Pick a device [1-2]: 1</text>
<text x="18" y="152" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7a88b8" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.227;0.250;1" dur="15.0s" repeatCount="indefinite"/>Auditing 192.168.0.50 (Tuya-assoc. feeder).</text>
<text x="18" y="170" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7a88b8" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.280;0.303;1" dur="15.0s" repeatCount="indefinite"/>Watch-LAN on: spoofing 3 peer(s)...</text>
<text x="18" y="188" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7a88b8" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.367;0.390;1" dur="15.0s" repeatCount="indefinite"/>Listing UPnP port forwards (read-only)...</text>
<text x="18" y="206" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#ffc777" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.433;0.457;1" dur="15.0s" repeatCount="indefinite"/>  TCP :554 -&gt; 192.168.0.50:554 'Camera'  &lt;- risky</text>
<text x="18" y="224" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#ffc777" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.520;0.543;1" dur="15.0s" repeatCount="indefinite"/>192.168.0.50     grade D  (6 destinations, 8 findings)</text>
<text x="18" y="242" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7a88b8" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.520;0.543;1" dur="15.0s" repeatCount="indefinite"/>Report written to feeder.html</text>
<text x="18" y="260" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#c8d3f5" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.600;0.623;1" dur="15.0s" repeatCount="indefinite"/> </text>
<text x="18" y="278" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#4fd6be" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.600;0.623;1" dur="15.0s" repeatCount="indefinite"/>$ iotaudit credcheck 192.168.0.50</text>
<text x="18" y="296" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7a88b8" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.667;0.690;1" dur="15.0s" repeatCount="indefinite"/>Type exactly: TEST DEFAULT LOGINS ON 192.168.0.50</text>
<text x="18" y="314" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7fd962" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.747;0.770;1" dur="15.0s" repeatCount="indefinite"/>TEST DEFAULT LOGINS ON 192.168.0.50</text>
<text x="18" y="332" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#ff757f" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.833;0.857;1" dur="15.0s" repeatCount="indefinite"/>[high] Default telnet login accepted - The device</text>
<text x="18" y="350" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13.5" fill="#7a88b8" opacity="0"><animate attributeName="opacity" values="0;0;1;1" keyTimes="0;0.833;0.857;1" dur="15.0s" repeatCount="indefinite"/>accepted a well-known default telnet login (user &quot;root&quot;).</text>
<rect x="18" y="354" width="8" height="14" fill="#c8d3f5" opacity="0"><animate attributeName="opacity" values="0;0;1;0;1;0" keyTimes="0;0.85;0.86;0.90;0.94;1" dur="15.0s" repeatCount="indefinite"/></rect>
</svg>
